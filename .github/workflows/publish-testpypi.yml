name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked distributions to TestPyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install build twine check-wheel-contents
      - name: Read release metadata
        id: metadata
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "itr-methods-private"
          assert project["license"] == "CC-BY-NC-4.0"
          assert not any(c.startswith("Private ::") for c in project["classifiers"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f'version={project["version"]}', file=output)
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to TestPyPI
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/itr-methods-private/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Retrieve checked distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
      - name: Publish using the TestPyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    name: Install from TestPyPI and test
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies from their normal indexes
        run: |
          python -m pip install 'numpy>=1.26' 'scipy>=1.12' 'scikit-learn>=1.6' 'matplotlib>=3.8' 'joblib>=1.3'
          python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
      - name: Install the published wheel from TestPyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --no-deps --only-binary=:all: --index-url https://test.pypi.org/simple/ "itr-methods-private==$RELEASE_VERSION"
      - name: Check installed version and license
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import metadata
          import itr_methods

          installed = metadata("itr-methods-private")
          assert installed["Version"] == os.environ["RELEASE_VERSION"]
          assert itr_methods.__version__ == os.environ["RELEASE_VERSION"]
          assert installed["License-Expression"] == "CC-BY-NC-4.0"
          print("Installed from TestPyPI:", installed["Name"], installed["Version"])
          print("License:", installed["License-Expression"])
          PY
          itr-doctor --require nscf
      - name: Run regression tests against the published package
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

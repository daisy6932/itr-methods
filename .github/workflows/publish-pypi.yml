name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed release files to production PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reviewed release files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read release metadata
        id: metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          manifest = json.loads(Path(f'.github/releases/{project["version"]}.json').read_text())
          assert project["name"] == manifest["distribution"] == "itr-methods"
          assert project["version"] == manifest["version"]
          assert project["license"] == manifest["license"] == "CC-BY-NC-4.0"
          assert not any(c.startswith("Private ::") for c in project["classifiers"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f'version={project["version"]}', file=output)
          PY
      - name: Retrieve the reviewed release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "itr_methods-$RELEASE_VERSION-py3-none-any.whl" --pattern "itr_methods-$RELEASE_VERSION.tar.gz"
      - name: Check approved hashes and package contents
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          manifest = json.loads(Path(f'.github/releases/{os.environ["RELEASE_VERSION"]}.json').read_text())
          assert {p.name for p in Path("dist").iterdir()} == set(manifest["files"])
          for name, expected in manifest["files"].items():
              data = (Path("dist") / name).read_bytes()
              assert len(data) == expected["bytes"], name
              assert hashlib.sha256(data).hexdigest() == expected["sha256"], name
              print("Approved file verified:", name, expected["sha256"])
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              for name in archive.namelist():
                  if name.startswith("itr_methods/"):
                      assert archive.read(name) == (Path("src") / name).read_bytes(), name
                  elif "/data/share/itr_methods/" in name:
                      relative = name.split("/data/share/itr_methods/", 1)[1]
                      assert archive.read(name) == Path(relative).read_bytes(), relative
          PY
      - name: Validate package metadata and wheel layout
        run: |
          python -m pip install twine check-wheel-contents
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Save verified release files
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to production PyPI
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/itr-methods/${{ needs.validate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using the production PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    name: Install from PyPI and test
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
      - name: Install the published package from PyPI
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m pip install --index-url https://pypi.org/simple/ "itr-methods[nscf,plot,test]==$RELEASE_VERSION"
          python -m pip check
      - name: Check the installed release
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import metadata
          import itr_methods

          installed = metadata("itr-methods")
          assert installed["Version"] == itr_methods.__version__ == os.environ["RELEASE_VERSION"]
          assert installed["License-Expression"] == "CC-BY-NC-4.0"
          print("Installed from PyPI:", installed["Name"], installed["Version"])
          print("License:", installed["License-Expression"])
          print("Module:", itr_methods.__file__)
          PY
          itr-doctor --require nscf
      - name: Run regression tests against the PyPI installation
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

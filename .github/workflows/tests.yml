name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU-only PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install '.[nscf,plot,test]' build wheel
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installation
        run: itr-doctor --require nscf
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Run examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/quickstart.py
          python examples/scaf_path_figure.py
          python examples/nscf_dendrogram_figure.py

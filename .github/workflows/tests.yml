name: Private package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt build 'setuptools>=68' wheel
      - name: Build distributions locally (no upload)
        run: python -m build --no-isolation
      - name: Install wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Exercise tutorials
        run: |
          python examples/quickstart.py
          python examples/cross_validation.py

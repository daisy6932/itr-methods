[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nscf-itr-method"
version = "0.2.0"
description = "Neural supervised treatment clustering for individualized treatment rules"
readme = "README.md"
requires-python = ">=3.10"
maintainers = [{name = "Daixi Huang"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.7,<3",
  "scipy>=1.12,<1.16",
  "matplotlib>=3.8,<3.11",
  "scikit-learn>=1.6,<2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2610.19104"
Repository = "https://github.com/daisy6932/nscf_itr_method"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nscf = ["defaults.json"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itr-methods-private"
version = "0.2.38"
description = "Python estimators for supervised clustering of treatment policies"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE.txt"]
maintainers = [{name = "Daixi Huang", email = "daixih@umich.edu"}]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.6"]

[project.urls]
Repository = "https://github.com/daisy6932/itr-methods"
Issues = "https://github.com/daisy6932/itr-methods/issues"

[project.optional-dependencies]
nscf = ["torch>=2.7"]
plot = ["matplotlib>=3.8"]
test = ["joblib>=1.3"]

[project.scripts]
itr-doctor = "itr_methods.doctor:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"itr_methods._nscf" = ["defaults.json"]

[tool.setuptools.data-files]
"share/itr_methods_private" = ["README.md"]
"share/itr_methods_private/docs" = ["docs/NSCF_TUTORIAL.ipynb", "docs/SCAF_TUTORIAL.ipynb"]
"share/itr_methods_private/examples" = [
    "examples/quickstart.py",
    "examples/scaf_path_figure.py",
    "examples/nscf_dendrogram_figure.py",
]
